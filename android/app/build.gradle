// HAND-MAINTAINED. This file began as FlutterFlow export scaffolding but has been
// edited by hand (release signing, minification, lint config). It is no longer
// generated code and does not get the "generated, review lightly" discount --
// review it in full. See .claude/skills/cto-review/references/dart-client.md.

plugins {
   id "com.android.application"
   id "kotlin-android"
   id "dev.flutter.flutter-gradle-plugin"
   id "com.google.gms.google-services"  // Google Services plugin

   id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

    // Validate before use. Without this, a missing or misspelled key yields
    // file(null) and a Gradle error that never mentions key.properties.
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        .findAll { !keystoreProperties[it] }
    if (missing) {
        throw new GradleException(
            "android/key.properties is missing required key(s): ${missing.join(', ')}. " +
            "See android/KEYSTORE.md for the expected format.")
    }
} else {
    // Do not fail: `flutter run --release` must work on a machine with no keystore.
    // But say so loudly -- a debug-signed bundle is rejected by Google Play, and a
    // silent fallback here is how an unshippable artifact reaches an upload attempt.
    //
    // println, not logger.warn: Flutter filters Gradle's log output and warn-level
    // messages emitted during configuration do not survive it.
    println ""
    println "WARNING: android/key.properties not found."
    println "  Release builds will be signed with the DEBUG key and CANNOT be"
    println "  uploaded to Google Play. See android/KEYSTORE.md to set one up."
    println ""
}

android {
    namespace "com.reddevinc.habitcrafts"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.reddevinc.habitcrafts"
        minSdkVersion 28
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
}
